name: run the demo

# Runs the demo on a GitHub-hosted Linux machine. The Vortex node is NOT in this
# repository: the job fetches it over SSH from the project's own server using a
# deploy key kept in this repository's secrets (VXPUB_KEY, VXPUB_HOST). The key
# unlocks one thing — a read-only copy of the binary — and nothing else.
# Forks do not receive the secrets, so a fork can read these runs but not the
# binary. Runs are public: open any run below to see the output and download
# the ledgers. It also runs on a schedule, so there is always a recent one.

on:
  workflow_dispatch:
    inputs:
      records_per_car:
        description: "records each car sends"
        default: "40"
      period_s:
        description: "seconds between records"
        default: "0.3"
  schedule:
    - cron: "17 6 * * 1"     # every Monday 06:17 UTC
  push:
    branches: [ main ]

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: "Tesla server needs libzmq"
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config libzmq3-dev >/dev/null

      - name: "setup (Tesla proto to Python, clone their repo)"
        run: ./setup.sh

      - name: "fetch the Vortex node (read-only deploy key that can do nothing else)"
        env:
          VXPUB_KEY: ${{ secrets.VXPUB_KEY }}
          VXPUB_HOST: ${{ secrets.VXPUB_HOST }}
        run: |
          test -n "$VXPUB_KEY" || { echo "no deploy key in this repository's secrets (forks do not get it) — see README"; exit 1; }
          mkdir -p ~/.ssh bin && chmod 700 ~/.ssh
          printf '%s\n' "$VXPUB_KEY" > ~/.ssh/vxpub && chmod 600 ~/.ssh/vxpub
          ssh-keyscan -t ed25519 "$VXPUB_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/vxpub -o BatchMode=yes "vxpub@$VXPUB_HOST" > bin/vortex_dse_full3-linux-x86_64
          chmod +x bin/vortex_dse_full3-linux-x86_64
          ls -la bin/ && sha256sum bin/vortex_dse_full3-linux-x86_64

      - name: "run the demo (A - no server, B - Tesla reference server)"
        env:
          N: ${{ github.event.inputs.records_per_car || '40' }}
          PERIOD: ${{ github.event.inputs.period_s || '0.3' }}
        run: |
          chmod +x run_demo.sh
          ./run_demo.sh | tee demo_output.txt

      - name: publish the result on the job summary
        if: always()
        run: |
          { echo '```'; cat demo_output.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: "upload the three ledgers and Tesla server log (never the binary)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ledgers-and-logs
          path: |
            run/d*/ledger_node*.txt
            run/records_*.jsonl
            run/tesla_server.log
            demo_output.txt

      - name: remove the binary from the runner
        if: always()
        run: rm -rf bin ~/.ssh/vxpub
